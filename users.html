<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
        .hidden { display: none; }
        #error { color: #cf222e; }
        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
        .controls input, .controls select { padding: 0.5rem; }
        .user-card { border: 1px solid #d0d7de; border-radius: 8px; padding: 0.8rem; margin-bottom: 0.6rem; }
        fieldset { margin-top: 2rem; }
        fieldset input, fieldset textarea { display: block; margin: 0.4rem 0; padding: 0.4rem; width: 100%; max-width: 420px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>User Directory</h1>
        <div id="loading">Loading...</div>
        <div id="error" class="hidden" role="alert"></div>

        <div class="controls">
            <input type="search" id="search" placeholder="Search name or email">
            <select id="sort">
                <option value="asc">Name A-Z</option>
                <option value="desc">Name Z-A</option>
            </select>
            <select id="city-filter"><option value="">All cities</option></select>
        </div>

        <div id="users-container"></div>

        <fieldset>
            <legend>Create a post (POST request)</legend>
            <form id="post-form">
                <input type="text" id="post-title" placeholder="Title" required>
                <textarea id="post-body" placeholder="Body" rows="3" required></textarea>
                <button type="submit">Submit post</button>
            </form>
            <pre id="post-result"></pre>
        </fieldset>
    </div>
    <script src="users.js"></script>
</body>
</html>
